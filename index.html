<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Capti Tournoi</title>
<style>

  .meta { color: var(--mut); font-size: 12px; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 8px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--bd); }
  .assoc { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: 100%; padding-left: 26px; }
  .assoc select { max-width: 260px; }
  .pill.ok { background: rgba(34,197,94,.15); color: var(--ok); }
  .picker { width: 100%; display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow: auto; background: rgba(0,0,0,.2); border: 1px solid var(--bd); border-radius: 8px; padding: 8px; }

  .modal input, .modal select { width: 100%; margin-bottom: 8px; }
  .modal label { display: block; }
  .flash { animation: flash 2.5s ease; }
  @keyframes flash { 0%, 60% { background: rgba(59,130,246,.35); border-color: var(--ac); } 100% { background: var(--card); } }
  .upload-card { display: flex; gap: 10px; align-items: center; border: 1px solid var(--ok); border-radius: 8px; padding: 8px; background: rgba(34,197,94,.08); }
  .upload-card.err { border-color: var(--bad); background: rgba(239,68,68,.08); }
  .upload-card img { width: 72px; height: 72px; object-fit: contain; background: #0f172a; border-radius: 6px; }
  .up-text { flex: 1; }

  .assoc-select { max-width: 230px; }
  .more, .gallery { width: 100%; display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,.2); border: 1px solid var(--bd); border-radius: 8px; padding: 8px; }
  .more { flex-direction: row; flex-wrap: wrap; align-items: center; }
  .uploadbtn { cursor: pointer; padding: 6px 10px; border: 1px solid var(--bd); border-radius: 8px; background: #0f172a; }
  .uploadbtn:hover { border-color: var(--ac); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; max-height: 340px; overflow: auto; }

  .previews[hidden] { display: none; }
  .pv-head { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
  .pv-label { font-size: 11px; letter-spacing: 1.5px; color: #64748b; margin-bottom: 4px; }
  .pv-frame { position: relative; height: 170px; overflow: hidden; border: 1px solid var(--bd); border-radius: 8px; background: repeating-conic-gradient(#1b2336 0% 25%, #141a29 0% 50%) 50% / 20px 20px; }
  .pv-frame iframe { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; border: 0; transform-origin: top left; pointer-events: none; }
  .pv-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--mut); font-size: 12px; text-align: center; padding: 8px; pointer-events: none; }
  .previews[data-mode=scorebird] .pv-frame { height: 90px; }
  @media (max-width: 900px) { .previews { grid-template-columns: 1fr; } }
  .page { display: flex; flex-direction: column; gap: 16px; }
  .glace-title { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .glace-title .icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(56,189,248,.15); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .glace-title .arena { color: var(--mut); font-weight: 400; font-size: 14px; }
  .spacer { flex: 1; }
  .sb { width: 90px; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .panels { grid-template-columns: 1fr; } }
  .panel-group { display: flex; flex-direction: column; gap: 10px; }
  .panel { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; overflow: hidden; }
  .panel-header { padding: 12px 18px; border-bottom: 1px solid var(--bd); display: flex; align-items: center; justify-content: space-between; }
  .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #64748b; }

  .panel-badge.live { background: rgba(239,68,68,.15); color: var(--bad); }
  .panel-badge.next { background: rgba(34,197,94,.12); color: var(--ok); }
  .match-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .match-card.empty { text-align: center; padding: 36px 18px; color: #64748b; }
  .match-meta { display: flex; align-items: center; gap: 8px; color: var(--mut); font-size: 13px; flex-wrap: wrap; }
  .tag { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: rgba(59,130,246,.12); color: var(--ac); }
  .tag.round { background: rgba(245,158,11,.12); color: #f59e0b; }
  .match-teams { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .team { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .team-logo { width: 54px; height: 54px; border-radius: 50%; background: var(--bg); border: 3px solid var(--bd); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: var(--mut); overflow: hidden; }
  .team-logo img { width: 100%; height: 100%; object-fit: cover; }
  .team-name { font-size: 14px; font-weight: 600; text-align: center; line-height: 1.2; }
  .score { display: flex; align-items: center; gap: 6px; }
  .score-input { width: 56px; padding: 6px 4px; font: 700 22px ui-monospace, monospace; text-align: center; -moz-appearance: textfield; }
  .score-input::-webkit-inner-spin-button, .score-input::-webkit-outer-spin-button, .score-input-sm::-webkit-inner-spin-button, .score-input-sm::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .score-sep { font: 700 24px ui-monospace, monospace; color: #64748b; align-self: center; }
  .match-time { text-align: center; font-size: 13px; color: #64748b; }
  .color-control { padding: 10px; background: rgba(255,255,255,.02); border: 1px solid var(--bd); border-radius: 10px; }
  .color-control-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: #64748b; margin-bottom: 8px; }
  .color-teams { display: flex; gap: 10px; flex-wrap: wrap; }
  .color-team-row { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: rgba(0,0,0,.2); border-radius: 8px; border: 1px solid var(--bd); }
  .color-team-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .color-team-label { font-size: 10px; color: #64748b; font-weight: 600; text-transform: uppercase; }
  .color-team-name-label { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .color-mode-toggle { display: flex; }
  .color-mode-toggle button { border-radius: 0; padding: 3px 9px; font-size: 11px; }
  .color-mode-toggle button:first-child { border-radius: 6px 0 0 6px; }
  .color-mode-toggle button:last-child { border-radius: 0 6px 6px 0; }
  .color-mode-toggle button.active { background: var(--ac); border-color: var(--ac); }
  .sponsor-box { display: flex; gap: 8px; align-items: center; }
  .sponsor-box img { max-height: 44px; max-width: 120px; object-fit: contain; }
  .btn-full { width: 100%; padding: 10px; }
  .schedule-panel { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; overflow: hidden; }
  .schedule-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bd); flex-wrap: wrap; gap: 8px; }
  .schedule-header h2 { margin: 0; font-size: 15px; }
  .filter-tabs { display: flex; gap: 4px; }
  .filter-tab { border: none; background: transparent; color: #64748b; font-weight: 600; padding: 5px 10px; }
  .filter-tab.active { color: var(--tx); background: rgba(255,255,255,.08); }
  .schedule-table tr.next td { background: rgba(34,197,94,.06); }
  .mono { font-family: ui-monospace, monospace; color: #64748b; }
  .strong { font-weight: 600; }
  .mid { text-align: center; }
  .score-input-sm { width: 40px; min-width: 0; padding: 4px 2px; font: 600 13px ui-monospace, monospace; text-align: center; }
  .acts { display: flex; gap: 4px; }
  .acts button { padding: 3px 8px; font-size: 12px; }
  .pill.live { background: rgba(239,68,68,.2); color: var(--bad); }
  .pill.upcoming { background: rgba(59,130,246,.12); color: var(--ac); }
  .pill.done { color: #64748b; }
  input[type=color] { padding: 0; width: 34px; height: 28px; }
  input[type=checkbox] { width: 18px; height: 18px; padding: 0; accent-color: var(--ac); }
  .logo { width: 36px; height: 36px; object-fit: contain; border-radius: 6px; background: #0f172a; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 4px; border-bottom: 1px solid var(--bd); text-align: left; white-space: nowrap; }
  th { font-size: 11px; color: var(--mut); text-transform: uppercase; }
  td input, td select { width: 100%; min-width: 70px; }
  td input.n { width: 56px; min-width: 0; }
  .pill { padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #1e293b; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--card); border: 1px solid var(--bd); border-radius: 10px; padding: 8px; }
  .item input[type=text] { flex: 1; min-width: 140px; }
  #toast { position: fixed; bottom: 16px; right: 16px; background: var(--card); border: 1px solid var(--bd); padding: 8px 14px; border-radius: 10px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
  code { color: var(--mut); }
</style>

<body>
<header>
  <h1>Capti Tournoi</h1>
  <span id="conn" class="badge wait">Chargement…</span>
  <span id="user"></span>
</header>
<div id="bar" class="bar"></div>
<section id="previews" class="previews" hidden></section>
<nav id="tabs"></nav>
<main id="app"></main>
<div id="toast"></div>

<script>
  // Si la page ne se charge pas complètement (anciens fichiers gardés en cache par le navigateur), on le dit clairement.
  const loadFail = (why) => {
    const app = document.getElementById("app");
    if (app && !window.__charge) app.textContent = `La page n'a pas pu se charger complètement (${why}). Recharge avec Cmd + Maj + R.`;
  };
  window.addEventListener("error", (e) => loadFail(e.message));
  window.addEventListener("unhandledrejection", (e) => loadFail(String(e.reason?.message ?? e.reason)));
  setTimeout(() => loadFail("délai dépassé"), 10000);
</script>
<script type="module">
import {
  db, auth, ref, onValue, get, set, update, push,
  GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
} from "./firebase.js?v=6f5832a0";
import { h, fill, fallbackImg } from "./dom.js?v=6f5832a0";
import {
  sortMatches, neighbor, following, statut, colorOf, sideName,
  parseSchedule, uniqueTeams, teamIndex, buildSync, defaultGlaces, matchesUsing, normName, pairFullNames,
  fromLib, toLib, libCandidates, prefixKeys, newTournament, legacyMove, hasLegacy, hasLegacyMatches,
  mergeTeams, duplicateMatches, deleteMatches, restoreMatches, scorebirdUrl, galleryItems, galleryRank, safeFileName, rawUrl,
} from "./logic.js?v=6f5832a0";
import { readScheduleFile } from "./import-file.js?v=6f5832a0";
import { loadTree, addToCache, publishImage, testToken } from "./galerie.js?v=6f5832a0";
import { graphiques } from "./config.js?v=6f5832a0";
import { TEAMS, SPONSORS } from "./seed.js?v=6f5832a0";

// pub : vue du tournoi selectionne (teams, sponsors, matches, glaces) ; lib, actif, liste : bibliotheques, tournoi actif, index des tournois.
let pub = {};
let priv = {};
let lib = {};
let actif = null;
let liste = {};
let cur = null;
let legacy = {};
let tid = null;
let user = null;
let online = false;
let tab = `glace${new URLSearchParams(location.search).get("glace") === "2" ? 2 : 1}`;
let filtre = "Tous";
let dirty = false;

/* ---------- ecriture ---------- */
const toast = (msg) => {
  const t = document.getElementById("toast");
  t.style.pointerEvents = "";
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("show"), 2500);
};
const w = async (fn) => {
  try { await fn(); return true; } catch (e) {
    toast(`Écriture refusée (${e.code ?? e.message}). Connecté et UID autorisé ?`);
    return false;
  }
};
// Message avec un bouton Annuler pendant 15 secondes : restore() reecrit ce qui vient d'etre supprime.
function undoable(msg, restore) {
  const t = document.getElementById("toast");
  const hide = () => { t.classList.remove("show"); t.style.pointerEvents = ""; };
  t.replaceChildren(`${msg} `, h("button", { onclick: async () => { clearTimeout(toast.t); hide(); if (await w(restore)) toast("Rétabli."); } }, "Annuler"));
  t.style.pointerEvents = "auto";
  t.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(hide, 15000);
}
const put = (path, val) => w(() => set(ref(db, path), val === "" || val === undefined ? null : val));
const btn = (label, fn, cls = "") => h("button", { class: cls, onclick: fn }, label);

// Chemin de base du tournoi selectionne : seul point d'entree, a n'appeler que lorsqu'un tournoi est selectionne.
const base = () => `public/tournois/${tid}`;
const refreshView = () => { pub = { ...(cur ?? {}), lib, actif, liste }; };

/* ---------- petits morceaux ---------- */
const T = (id) => pub.teams?.[id];
// Adresse de secours d'un logo du depot (fichier brut) tant que sa page publique n'est pas en ligne.
const rawOf = (u) => rawUrl(u, graphiques);
const logoImg = (src) => (src ? fallbackImg(src, rawOf, { class: "logo" }) : h("div", { class: "logo" }));
const optionsOf = (obj, sel, label, empty = "—") => [
  h("option", { value: "" }, empty),
  Object.entries(obj ?? {}).map(([id, o]) => h("option", { value: id, selected: id === sel }, label(o))),
];

// Reduit une image choisie a `max` pixels au plus (PNG, transparence conservee).
async function reduceImage(file, max) {
  const bm = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bm.width, bm.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bm.width * k);
  c.height = Math.round(bm.height * k);
  c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height);
  return c.toDataURL("image/png");
}

/* ---------- Page d'une glace ---------- */
const dateFR = (d, opts = { weekday: "long", day: "numeric", month: "long" }) => {
  const dt = new Date(`${d}T12:00:00`);
  return Number.isNaN(dt.getTime()) ? (d ?? "") : dt.toLocaleDateString("fr-CA", opts);
};
// Une couleur venant de la base n'entre dans un style qu'au format #rrggbb.
const safeColor = (c) => (/^#[0-9a-f]{6}$/i.test(c ?? "") ? c : "#666666");
const defaultMode = (key) => (key === "away" ? "Secondary" : "Primary");

function team(m, key, mp) {
  const t = T(m[key]);
  const color = safeColor(colorOf(t, m[`${key}Mode`] ?? defaultMode(key)));
  const name = sideName(m, key, pub.teams) || "—";
  const score = m[`${key}Score`];
  const setScore = (v) => put(`${mp}${key}Score`, v);
  return h("div", { class: "team" },
    h("div", { class: "team-logo", style: `border-color:${color};box-shadow:0 0 10px ${color}55` },
      t?.logo ? fallbackImg(t.logo, rawOf) : name.charAt(0)),
    h("div", { class: "team-name", title: t?.complet ?? "" }, name),
    h("div", { class: "score" },
      btn("−", () => setScore(Math.max(0, (score ?? 0) - 1))),
      h("input", { type: "number", min: 0, class: "score-input", value: score ?? "", placeholder: "–",
        onchange: (e) => setScore(e.target.value === "" ? null : Number(e.target.value)) }),
      btn("+", () => setScore((score ?? 0) + 1))));
}

function colorControl(m, mp) {
  const row = (key, label) => {
    const mode = m[`${key}Mode`] ?? defaultMode(key);
    return h("div", { class: "color-team-row" },
      m[key] && h("input", { type: "color", value: safeColor(colorOf(T(m[key]), mode)),
        onchange: (e) => put(`${base()}/teams/${m[key]}/${mode === "Primary" ? "primary" : "secondary"}`, e.target.value) }),
      h("div", { class: "color-team-info" },
        h("span", { class: "color-team-label" }, label),
        h("span", { class: "color-team-name-label" }, sideName(m, key, pub.teams) || "—")),
      h("div", { class: "color-mode-toggle" },
        ["Primary", "Secondary"].map((x) => btn(x === "Primary" ? "Pri" : "Sec", () => put(`${mp}${key}Mode`, x), mode === x ? "active" : ""))));
  };
  return h("div", { class: "color-control" },
    h("div", { class: "color-control-title" }, "🎨 Couleurs"),
    h("div", { class: "color-teams" }, row("away", "Visiteur"), row("home", "Local")));
}

function matchCard(id) {
  const m = pub.matches?.[id];
  if (!m) return h("div", { class: "match-card empty" }, "Aucun match");
  const mp = `${base()}/matches/${id}/`;
  const sponsor = pub.sponsors?.[m.sponsor];
  return h("div", { class: "match-card" },
    h("div", { class: "match-meta" },
      m.division && h("span", { class: "tag" }, m.division),
      m.round && h("span", { class: "tag round" }, m.round),
      h("span", {}, `#${m.num ?? "?"}`)),
    h("div", { class: "match-teams" }, team(m, "away", mp), h("div", { class: "score-sep" }, "–"), team(m, "home", mp)),
    h("div", { class: "match-time" }, `${dateFR(m.date)} ${m.heure ?? ""}`),
    colorControl(m, mp),
    h("div", { class: "sponsor-box" },
      sponsor?.logo && fallbackImg(sponsor.logo, rawOf, { alt: sponsor.nom ?? "" }),
      h("select", { onchange: (e) => put(`${mp}sponsor`, e.target.value) }, optionsOf(pub.sponsors, m.sponsor, (s) => s.nom, "Commanditaire…"))));
}

const panel = (title, badge, cls, body) => h("div", { class: "panel" },
  h("div", { class: "panel-header" }, h("div", { class: "section-label" }, title), h("div", { class: `panel-badge ${cls}` }, badge)), body);

function overlayLinks(g) {
  const base = new URL("overlay.html", location.href).href;
  return h("div", { class: "row" }, [["Live", "live"], ["Next", "next"], ["Scorebird", "url"]].map(([label, mode]) =>
    btn(`Copier URL ${label}`, async () => {
      try { await navigator.clipboard.writeText(`${base}?glace=${g}&mode=${mode}`); toast("URL copiée"); } catch { toast("Copie impossible"); }
    })));
}

const PILL = { Live: "live", "À venir": "upcoming", "Complété": "done" };

function schedule(g, list, gl) {
  const gp = `${base()}/glaces/${g}/`;
  const rows = list.map((m) => ({ m, st: statut(list, gl.live, m.id) })).filter((r) => filtre === "Tous" || r.st === filtre);
  const score = (m, key) => h("input", { type: "number", min: 0, class: "score-input-sm", value: m[`${key}Score`] ?? "", placeholder: "–",
    onchange: (e) => put(`${base()}/matches/${m.id}/${key}Score`, e.target.value === "" ? null : Number(e.target.value)) });
  return h("div", { class: "schedule-panel" },

/* ---------- onglet Horaire ---------- */
function horaire() {
  const root = `${base()}/matches`;
  const sel = (picked[root] ??= new Set());
  for (const id of [...sel]) if (!(id in (pub.matches ?? {}))) sel.delete(id);
  const rows = [1, 2].flatMap((g) => {
    const list = sortMatches(pub.matches, g);
    return list.map((m) => ({ m, st: statut(list, pub.glaces?.[g]?.live, m.id) }));
  }).filter((r) => filtre === "Tous" || r.st === filtre);
  const visible = rows.map((r) => r.m.id);
  const allOn = visible.length > 0 && visible.every((id) => sel.has(id));
  const dm = duplicateMatches(pub.matches, pub.glaces);

  const add = () => {
    const num = Math.max(0, ...Object.values(pub.matches ?? {}).map((m) => m.num ?? 0)) + 1;
    w(() => push(ref(db, root), { num, glace: 1 }));
  };
  // Suppression de matchs (leurs notes aussi) avec Annuler : les glaces qui les affichaient sont videes puis rétablies.
  const supprimer = async (ids) => {
    const set = new Set(ids);
    if (!confirm(`Supprimer ${ids.length} match(s) ? Leurs notes (caméraman, note) sont aussi effacées.`)) return;
    const up = { ...prefixKeys(deleteMatches(set, pub.glaces), base()), ...Object.fromEntries(ids.map((id) => [`prive/${tid}/${id}`, null])) };
    const back = { ...prefixKeys(restoreMatches(set, pub.matches, pub.glaces), base()), ...Object.fromEntries(ids.filter((id) => priv[id]).map((id) => [`prive/${tid}/${id}`, priv[id]])) };
    if (await w(() => update(ref(db), up))) {
      ids.forEach((id) => sel.delete(id));
      undoable(`${ids.length} match(s) supprimé(s).`, () => update(ref(db), back));
    }
  };
  const supprimerDoublons = async () => {
    const resume = dm.groups.map((g) => `#${g.num} ×${g.drop.length + 1}`).join(", ");
    if (!confirm(`Supprimer ${dm.drop.length} match(s) en double ?\n${resume}\nPour chaque numéro, on garde le match qui a des pointages, un commanditaire ou qui est affiché en direct, sinon le plus ancien.`)) return;
    await w(() => update(ref(db), { ...prefixKeys(dm.updates, base()), ...Object.fromEntries(dm.drop.map((id) => [`prive/${tid}/${id}`, null])) }));
  };
  const text = (path, val, type = "text", cls = "") =>
    h("input", { type, value: val ?? "", class: cls, onchange: (e) => put(path, e.target.value) });
  const num = (path, val) =>
    h("input", { type: "number", min: 0, class: "n", value: val ?? "",
      onchange: (e) => put(path, e.target.value === "" ? null : Number(e.target.value)) });
  const pick = (path, obj, cur, label, empty) =>
    h("select", { onchange: (e) => put(path, e.target.value) }, optionsOf(obj, cur, label, empty));

  const tr = ({ m, st }) => {
    const mp = `${base()}/matches/${m.id}/`;
    const pv = priv[m.id] ?? {};
    return h("tr", {},
      h("td", {}, h("input", { type: "checkbox", title: "Sélectionner", checked: sel.has(m.id), onchange: (e) => { if (e.target.checked) sel.add(m.id); else sel.delete(m.id); render(); } })),
      h("td", {}, text(`${mp}num`, m.num, "number", "n")),
      h("td", {}, h("select", { onchange: (e) => put(`${mp}glace`, Number(e.target.value)) },
        [1, 2].map((g) => h("option", { value: g, selected: Number(m.glace) === g }, g)))),
      h("td", {}, text(`${mp}date`, m.date, "date")),
      h("td", {}, text(`${mp}heure`, m.heure, "time")),
      h("td", {}, text(`${mp}division`, m.division)),
      h("td", {}, text(`${mp}round`, m.round)),
      h("td", {}, pick(`${mp}away`, pub.teams, m.away, (t) => t.nom, m.awayRef ?? "—")),
      h("td", {}, num(`${mp}awayScore`, m.awayScore), " – ", num(`${mp}homeScore`, m.homeScore)),
      h("td", {}, pick(`${mp}home`, pub.teams, m.home, (t) => t.nom, m.homeRef ?? "—")),
      h("td", {}, pick(`${mp}sponsor`, pub.sponsors, m.sponsor, (s) => s.nom)),
      h("td", {}, text(`prive/${tid}/${m.id}/camera`, pv.camera)),
      h("td", {}, text(`prive/${tid}/${m.id}/note`, pv.note)),
      h("td", {}, h("span", { class: `pill ${st}` }, st)),
      h("td", {}, btn("✕", () => supprimer([m.id]), "bad")));
  };

  return h("div", {},
    h("div", { class: "row", style: "margin:8px 0" },
      ["Tous", "Live", "À venir", "Complété"].map((f) => btn(f, () => { filtre = f; render(); }, filtre === f ? "on" : "")),
      btn("+ Ajouter un match", add, "ok"),
      visible.length > 0 && btn(allOn ? "Tout désélectionner" : "Tout sélectionner", () => {
        if (allOn) visible.forEach((id) => sel.delete(id)); else visible.forEach((id) => sel.add(id));
        render();
      }),
      sel.size > 0 && btn(`Supprimer la sélection (${sel.size})`, () => supprimer([...sel]), "bad"),
      dm.groups.length > 0 && btn(`Supprimer les matchs en double (${dm.drop.length})`, supprimerDoublons, "bad")),
    h("div", { class: "scroll" }, h("table", {},
      h("thead", {}, h("tr", {}, ["", "#", "Glace", "Date", "Heure", "Division", "Ronde", "Visiteur", "Score", "Local", "Commanditaire", "Caméraman", "Note", "Statut", ""].map((c) => h("th", {}, c)))),
      h("tbody", {}, rows.map(tr)))));
}

// Etat de l'envoi en cours, affiche dans la galerie : l'image envoyee s'y voit tout de suite (pour valider), puis on
// surveille la publication de sa page publique (GitHub Pages, 1 a 2 minutes) ; entre-temps le fichier brut sert de secours.
const up = { state: null, name: "", url: "", preview: "", msg: "" };
const UP_TEXT = {
  envoi: "⏳ Envoi à GitHub…",
  envoye: "✔ Envoyé à GitHub et enregistré comme logo. ⏳ Publication sur le site en cours (1 à 2 minutes) : l'image s'affiche déjà.",
  enligne: "✔ En ligne : l'adresse publique fonctionne (Scorebird peut l'utiliser).",
  lent: "La publication prend plus de temps que prévu. L'image s'affiche quand même ; réessaie « ↻ Actualiser » dans quelques minutes avant d'utiliser Scorebird.",
};
const probe = (url) => new Promise((res) => {
  const i = new Image();
  i.onload = () => res(true);
  i.onerror = () => res(false);
  i.src = `${url}${url.includes("?") ? "&" : "?"}t=${Date.now()}`;
});
async function surveillerPublication(url) {
  const t0 = Date.now();
  while (Date.now() - t0 < 5 * 60 * 1000 && up.url === url) {
    if (await probe(url)) { up.state = "enligne"; render(); return; }
    await new Promise((r) => setTimeout(r, 6000));
  }
  if (up.url === url) { up.state = "lent"; render(); }
}
const uploadCard = () => up.state && h("div", { class: `upload-card${up.state === "erreur" ? " err" : ""}` },
  up.preview && h("img", { src: up.preview, alt: "" }),
  h("div", { class: "up-text" }, h("b", {}, up.name), h("div", { class: "meta" }, up.state === "erreur" ? up.msg : UP_TEXT[up.state])),
  btn("OK", () => { up.state = null; render(); }));

// Envoi d'un logo vers le dossier graphiques/ de GitHub : image reduite a 400 px, NOUVEAU fichier (jamais de remplacement).
// Le jeton n'est lu qu'ici, au moment de l'envoi.
async function ajouterLogo(file, folder, nom, setLogo) {
  let token = null;
  try { token = (await get(ref(db, "secret/github"))).val()?.token ?? null; } catch { token = null; }
  if (!token) return toast("Pour ajouter un logo, enregistre d'abord ton jeton GitHub (onglet Sauvegarde).");
  Object.assign(up, { state: "envoi", name: file.name, url: "", preview: "", msg: "" });
  render();
  try {
    const tree = gal.tree ?? await loadTree();
    const taken = tree.filter((x) => x.path.startsWith(`${graphiques.dossier}/${folder}/`)).map((x) => x.path.split("/").pop());
    const name = safeFileName(nom || file.name.replace(/\.[^.]+$/, ""), "png", taken);
    const dataUrl = await reduceImage(file, 400);
    Object.assign(up, { name, preview: dataUrl });
    render();
    const url = await publishImage(token, folder, name, dataUrl.split(",")[1]);
    addToCache(`${graphiques.dossier}/${folder}/${name}`);
    gal.tree = await loadTree();
    await setLogo(url);
    Object.assign(up, { state: "envoye", url });
    render();
    surveillerPublication(url);
  } catch (e) {
    Object.assign(up, { state: "erreur", msg: e.message });
    render();
  }
}

// Mise en evidence d'une ligne (nouvelle ou renommee, donc deplacee dans la liste triee) : defilement puis surbrillance.
const flash = { id: null, done: false };
const flashRow = (id) => { flash.id = id; flash.done = false; };
function showFlash() {
  const el = flash.id && document.querySelector(".flash");
  if (!el || flash.done) return;
  flash.done = true;
  el.scrollIntoView({ block: "center" });
  const id = flash.id;
  setTimeout(() => { if (flash.id === id) { flash.id = null; el.classList.remove("flash"); } }, 2500);
}

// Fenetre "Nouvelle equipe / Nouveau commanditaire" : rien n'est cree avant de valider, donc la ligne n'apparait pas
// (puis ne saute pas dans la liste triee) avant d'avoir son nom. La bibliotheque propose le logo, les couleurs et le nom complet.
function askNew({ title, fields, root, libItems, isLib }) {
  const dlg = h("dialog", { class: "modal" });
  // Fermer = retirer la fenetre puis redessiner la page (sinon la liste attendrait la fin de la saisie, tant que le champ garde le focus).
  const fermer = () => { if (dlg.isConnected) { dlg.close(); dlg.remove(); render(); } };
  const nom = h("input", { type: "text", placeholder: "Nom court (affiché dans l'horaire)" });
  const complet = fields.includes("complet") ? h("input", { type: "text", placeholder: "Nom complet (facultatif)" }) : null;
  const sel = !isLib && Object.keys(libItems).length ? h("select", {}) : null;
  const label = (l) => (l.complet ? `${l.nom} (${l.complet})` : l.nom);
  let touched = false;
  const fillSel = () => {
    if (!sel) return;
    const cands = libCandidates({ nom: nom.value, complet: complet?.value }, libItems);
    const others = Object.keys(libItems).filter((g) => !cands.includes(g)).sort((a, b) => normName(libItems[a].nom).localeCompare(normName(libItems[b].nom)));
    const opt = (g) => h("option", { value: g }, label(libItems[g]));
    const keepVal = sel.value;
    sel.replaceChildren(h("option", { value: "" }, "Aucune association"),
      cands.length > 0 && h("optgroup", { label: "★ Suggestion" }, cands.map(opt)),
      others.length > 0 && h("optgroup", { label: "Bibliothèque" }, others.map(opt)));
    sel.value = touched ? keepVal : (cands.length === 1 ? cands[0] : ""); // une seule suggestion : pre-choisie, visible avant de valider
  };
  const creer = async () => {
    const n = nom.value.trim();
    if (!n) { nom.focus(); return; }
    const gid = sel?.value;
    const data = {
      nom: n,
      ...(fields.includes("colors") && { primary: "#666666", secondary: "#dadada" }),
      ...(gid && { ...fromLib(libItems[gid]), lib: gid }),
      ...(complet?.value.trim() && { complet: complet.value.trim() }),
    };
    const key = push(ref(db, root)).key;
    if (await w(() => update(ref(db), { [`${root}/${key}`]: data }))) { flashRow(key); fermer(); }
  };
  nom.addEventListener("input", fillSel);
  complet?.addEventListener("input", fillSel);
  sel?.addEventListener("change", () => { touched = true; });
  dlg.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); creer(); }
    if (e.key === "Escape") { e.preventDefault(); fermer(); }
  });
  dlg.addEventListener("close", fermer); // Echap
  dlg.append(h("h3", {}, title), nom, complet, sel && h("label", { class: "meta" }, "Associer à la bibliothèque (logo, couleurs, nom complet)", sel),
    h("div", { class: "row" }, btn("Annuler", fermer), btn("Ajouter", creer, "ok")));
  fillSel();
  document.body.append(dlg);
  dlg.showModal();
  nom.focus();
}

// Liste modifiable, une ligne courte par element : logo (clic = galerie), nom, couleurs, menu d'association, ⋯ et ✕.
// scope "tournoi" : liste du tournoi selectionne, avec association a la bibliotheque (copie logo, couleurs, nom complet) ;
// scope "lib" : la bibliotheque globale. fields : "colors", "complet" (le nom court est celui de l'horaire).
function collection({ key, title, fields, scope }) {
  const isLib = scope === "lib";
  const root = isLib ? `public/lib/${key}` : `${base()}/${key}`;
  const folder = key === "teams" ? "logos" : "commanditaires";
  const items = (isLib ? lib[key] : pub[key]) ?? {};
  const libItems = lib[key] ?? {};
  const sel = (picked[root] ??= new Set());
  for (const id of [...sel]) if (!(id in items)) sel.delete(id);
  const entries = Object.entries(items).sort((a, b) => normName(a[1].nom).localeCompare(normName(b[1].nom)));
  const seed = key === "teams" ? TEAMS : SPONSORS;
  const add = () => askNew({ title: `Nouveau : ${title.toLowerCase()}`, fields, root, libItems, isLib });
  const loadSeed = () => w(() => update(ref(db, root), Object.fromEntries(seed.map((s) => [push(ref(db, root)).key, s]))));

  const supprimer = async (ids) => {
    const used = isLib ? 0 : matchesUsing(pub.matches, new Set(ids), USED_BY[key]);
    const warn = used ? `\n${used} match(s) les utilisent encore : leur nom apparaîtra vide (tu peux annuler juste après).` : "";
    if (!confirm(`Supprimer ${ids.length} élément(s) ?${warn}`)) return;
    const back = Object.fromEntries(ids.map((id) => [`${root}/${id}`, items[id]]));
    if (await w(() => update(ref(db, root), Object.fromEntries(ids.map((id) => [id, null]))))) {
      ids.forEach((id) => sel.delete(id));
      undoable(`${ids.length} élément(s) supprimé(s).`, () => update(ref(db), back));
    }
  };

  // Association avec la bibliotheque (tournoi seulement) : COPIE logo, couleurs et nom complet ; le nom court du tournoi ne change pas.
  const apply = (id, gid) => (gid
    ? w(() => update(ref(db, `${root}/${id}`), { ...fromLib(libItems[gid]), lib: gid }))
    : put(`${root}/${id}/lib`, null)); // dissocier : le lien disparait, ce qui a ete copie reste
  const versBiblio = (id, o) => {
    if (o.lib && libItems[o.lib]) {
      if (!confirm(`Mettre à jour « ${libItems[o.lib].nom} » dans la bibliothèque avec le logo, les couleurs et le nom complet de cette équipe ?`)) return;
      w(() => update(ref(db, `public/lib/${key}/${o.lib}`), toLib(o)));
    } else {
      const gid = push(ref(db, `public/lib/${key}`)).key;
      w(() => update(ref(db), { [`public/lib/${key}/${gid}`]: toLib(o), [`${root}/${id}/lib`]: gid }));
    }
  };
  const suggestions = isLib ? [] : entries.filter(([, o]) => !(o.lib && libItems[o.lib])).map(([id, o]) => [id, libCandidates(o, libItems)]).filter(([, c]) => c.length === 1);
  const appliquerSuggestions = () => {
    const noms = suggestions.map(([id, [gid]]) => `${items[id].nom} → ${libItems[gid].nom}`).join("\n");
    if (!confirm(`Associer ces ${suggestions.length} équipes à la bibliothèque ?\n${noms}`)) return;
    w(() => update(ref(db), Object.fromEntries(suggestions.flatMap(([id, [gid]]) =>
      Object.entries({ ...fromLib(libItems[gid]), lib: gid }).map(([k, v]) => [`${root}/${id}/${k}`, v])))));
  };
  const dup = isLib || key !== "teams" ? null : mergeTeams(pub.teams, pub.matches);
  const fusionner = () => {
    const noms = dup.groups.map((g) => `${items[g.keep].nom} ×${g.drop.length + 1}`).join("\n");
    if (!confirm(`Fusionner ces équipes en double ?\n${noms}\nOn garde la plus complète et les matchs sont rebranchés dessus.`)) return;
    w(() => update(ref(db), prefixKeys(dup.updates, base())));
  };

  // Petit menu a droite de la ligne : la suggestion d'abord, puis le reste de la bibliotheque ; "— Dissocier" retire le lien.
  const assocSelect = (id, o) => {
    const linked = o.lib && libItems[o.lib];
    const cands = libCandidates(o, libItems);
    const others = Object.keys(libItems).filter((gid) => !cands.includes(gid)).sort((a, b) => normName(libItems[a].nom).localeCompare(normName(libItems[b].nom)));
    const opt = (gid) => h("option", { value: gid, selected: gid === o.lib }, libItems[gid].complet ? `${libItems[gid].nom} (${libItems[gid].complet})` : libItems[gid].nom);
    return h("select", { class: "assoc-select", title: linked ? "Associée à la bibliothèque (copie du logo, des couleurs et du nom complet)" : "Associer à la bibliothèque : copie le logo, les couleurs et le nom complet",
      onchange: (e) => apply(id, e.target.value) },
      h("option", { value: "" }, linked ? "— Dissocier" : "Associer…"),
      cands.length > 0 && h("optgroup", { label: "★ Suggestion" }, cands.map(opt)),
      others.length > 0 && h("optgroup", { label: "Bibliothèque" }, others.map(opt)));
  };

  const morePanel = (id, o, p) => h("div", { class: "more" },
    fields.includes("complet") && h("label", { class: "meta" }, "Nom complet ",
      h("input", { type: "text", placeholder: "ex. Express de Mont-Joli", title: "Aussi reconnu à l'import", value: o.complet ?? "", onchange: (e) => put(`${p}complet`, e.target.value.trim()) })),

/* ---------- Importer un horaire ---------- */
const imp = { text: "", year: new Date().getFullYear(), dest: "current", mode: "sync", newName: "Nouveau tournoi", result: null, glaces: {}, teams: [], teamMap: {}, full: new Map() };

// Destination : le tournoi selectionne, ou un nouveau tournoi (sans equipes ni matchs : rien n'est associe a un autre tournoi).
const toNew = () => imp.dest === "new" || !tid;
const destTeams = () => (toNew() ? {} : pub.teams ?? {});
const destMatches = () => (toNew() ? {} : pub.matches ?? {});
// Matchs deja presents (meme numero) : "sync" (par defaut) les corrige et recree les equipes manquantes, "skip" les ignore.
const syncing = (dupes) => !toNew() && dupes.length > 0 && imp.mode === "sync";
const plan = (newId) => buildSync(imp.result.todo, imp.glaces, new Map(Object.entries(imp.teamMap)), newId,
  { teams: destTeams(), fullNames: imp.full, existing: syncing(imp.result.dupes) ? destMatches() : null });

function analyser() {
  const r = parseSchedule(imp.text, imp.year);
  const have = new Set(Object.values(destMatches()).map((m) => m.num));
  const dupes = r.matches.filter((m) => have.has(m.num));
  imp.result = { ...r, dupes, todo: syncing(dupes) ? r.matches : r.matches.filter((m) => !have.has(m.num)) };
  const lieux = [...new Set(imp.result.todo.map((m) => m.lieu))];
  imp.glaces = defaultGlaces(lieux);
  const idx = teamIndex(destTeams());
  const names = uniqueTeams(imp.result.todo);
  const { full, ambiguous } = pairFullNames(names.map((t) => t.nom), r.cells ?? []);
  imp.full = full;
  imp.teams = names.map((t) => ({ ...t, id: idx.get(t.key) ?? "", complet: full.get(t.key), ambig: ambiguous.get(t.key) }));
  imp.teamMap = Object.fromEntries(imp.teams.map((t) => [t.key, t.id]));
  render();
}

async function choisirFichier(e) {
  const f = e.target.files[0];
  if (!f) return;
  toast("Lecture du fichier…");
  try {
    imp.text = await readScheduleFile(f);
    analyser();
  } catch (err) {
    imp.result = { error: err.message, matches: [], skipped: [], todo: [], dupes: [] };
    render();
  }
}

async function lancerImport() {
  const isNew = toNew();
  const nid = isNew ? push(ref(db)).key : tid;
  const { updates: rows, stats } = plan(() => push(ref(db)).key);
  const updates = {
    ...prefixKeys(rows, `public/tournois/${nid}`),
    ...(isNew ? newTournament(nid, imp.newName.trim() || "Nouveau tournoi", Date.now()) : {}),
    ...(isNew && !actif ? { "public/actif": nid } : {}),
  };
  if (await w(() => update(ref(db), updates))) {
    toast(`${stats.added} ajouté(s), ${stats.updated} mis à jour, ${stats.teamsCreated} équipe(s) créée(s).`);
    imp.text = "";
    imp.result = null;
    imp.dest = "current";
    if (isNew) selectTournament(nid);
    tab = "horaire";
    render();
  }
}

// Connexion GitHub : le jeton est range dans secret/ (lisible et modifiable par ton compte seulement) et suit donc ton compte
// sur tous tes ordinateurs. Il n'apparait dans aucun message ; seule la date d'ajout (non secrete) est lue pour l'affichage.
async function enregistrerJeton(input) {
  const token = input.value.trim();
  if (token.length < 20 || /\s/.test(token)) return toast("Ce n'est pas un jeton GitHub valide.");
  if (await w(() => update(ref(db), { "secret/github": { token, ajoute: Date.now() }, "prive/githubAjoute": Date.now() }))) {
    input.value = "";
    toast("Jeton enregistré.");
  }
}
const retirerJeton = () => confirm("Retirer le jeton GitHub ? Tu ne pourras plus ajouter de logos depuis le dashboard.")
  && w(() => update(ref(db), { "secret/github": null, "prive/githubAjoute": null }));
async function tester() {
  try {
    const token = (await get(ref(db, "secret/github"))).val()?.token;
    if (!token) return toast("Aucun jeton enregistré.");
    toast((await testToken(token)) ? "✔ Le jeton fonctionne : écriture permise sur tournoi-hockey." : "Le jeton est valide, mais sans droit d'écriture sur tournoi-hockey.");
  } catch (e) { toast(e.message); }
}

/* ---------- Sauvegarde ---------- */
function sauvegarde() {
  const exporter = async () => {
    try {
      const [p, v] = await Promise.all([get(ref(db, "public")), get(ref(db, "prive"))]);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ public: p.val(), prive: v.val() }, null, 2)], { type: "application/json" }));
      a.download = `capti-tournoi-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (err) { toast(`Sauvegarde impossible : ${err.message}`); }
  };
  const restaurer = async (e) => {
    const f = e.target.files[0];
    if (!f || !confirm("Remplacer TOUTES les données par ce fichier ?")) return;
    try {
      const d = JSON.parse(await f.text());
      if (typeof d.public !== "object" || d.public === null) throw new Error("fichier invalide");
      await w(() => set(ref(db, "public"), d.public));
      await w(() => set(ref(db, "prive"), d.prive ?? null));
      toast("Restauré");
    } catch (err) { toast(`Restauration impossible : ${err.message}`); }
  };
  return h("div", { class: "list" },
    h("div", { class: "item" }, btn("Télécharger une sauvegarde (JSON)", exporter, "ok"),
      h("span", { class: "meta" }, "Tous les tournois, les bibliothèques et les notes privées. À faire avant chaque tournoi et à la fin de chaque journée.")),
    h("div", { class: "item" }, h("span", {}, "Restaurer depuis un fichier :"), h("input", { type: "file", accept: ".json", onchange: restaurer })),
    user && h("div", { class: "item" },
      h("b", {}, "Connexion GitHub (ajouter des logos)"),
      ghAjoute ? h("span", { class: "pill ok" }, `✔ jeton enregistré le ${new Date(ghAjoute).toLocaleDateString("fr-CA")}`) : h("span", { class: "pill" }, "aucun jeton"),
      h("input", { type: "password", id: "gh-token", autocomplete: "off", placeholder: "Colle ici ton jeton GitHub (commence par github_pat_)" }),
      btn("Enregistrer", () => enregistrerJeton(document.getElementById("gh-token")), "ok"),
      ghAjoute && btn("Tester", tester),
      ghAjoute && btn("Retirer", retirerJeton, "bad"),
      h("details", { class: "meta", style: "width:100%" }, h("summary", {}, "Comment créer le jeton (une seule fois)"),
        h("ol", {},
          h("li", {}, "Sur github.com : ton profil → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token."),
          h("li", {}, "Nom : Capti Tournoi. Expiration : 1 an."),
          h("li", {}, "Repository access : Only select repositories → tournoi-hockey (et rien d'autre)."),
          h("li", {}, "Permissions → Repository permissions → Contents : Read and write."),
          h("li", {}, "Generate token, copie-le (il n'est affiché qu'une fois) et colle-le ici. Il te suit sur tous tes ordinateurs, une fois connecté avec Google.")))),
    user && h("div", { class: "item" }, h("span", { class: "meta" }, "Ton UID (à coller dans database.rules.json) :"), h("code", {}, user.uid)));
}

/* ---------- Apercus LIVE / NEXT (en haut des pages de glace) ---------- */
// Conteneur persistant hors de #app : une iframe n'est rechargee que si son adresse change (pas a chaque point de score).
const pv = { mode: "overlay", cells: {}, head: null };
try { if (localStorage.getItem("tournoi-apercu") === "scorebird") pv.mode = "scorebird"; } catch { /* stockage indisponible : on continue sans */ }

function initPreviews() {
  const box = document.getElementById("previews");
  pv.head = h("div", { class: "pv-head" });
  box.append(pv.head);
  for (const slot of ["live", "next"]) {
    const iframe = h("iframe", { title: `Aperçu ${slot}`, tabindex: "-1", allow: "autoplay" });
    const msg = h("div", { class: "pv-msg" });
    const frame = h("div", { class: "pv-frame" }, iframe, msg);
    // L'overlay est une page de 1920 x 1080 : on en montre le haut a gauche, mis a l'echelle de la largeur disponible
    // (1100 px pour notre overlay, qui est un encadre en haut a gauche ; 1920 px pour la barre Scorebird).
    const rescale = () => { iframe.style.transform = `scale(${frame.clientWidth / (pv.mode === "scorebird" ? 1920 : 1100)})`; };
    new ResizeObserver(rescale).observe(frame);
    box.append(h("div", {}, h("div", { class: "pv-label" }, slot === "live" ? "APERÇU · LIVE" : "APERÇU · NEXT"), frame));
    pv.cells[slot] = { iframe, msg, rescale };
  }
}

function setFrame(cell, url, message = "") {
  if (cell.iframe.dataset.url !== url) { cell.iframe.dataset.url = url; cell.iframe.src = url; }
  cell.msg.textContent = message;
}

function setPreviewMode(mode) {
  pv.mode = mode;
  try { localStorage.setItem("tournoi-apercu", mode); } catch { /* idem */ }
  updatePreviews();
}

function updatePreviews() {
  const box = document.getElementById("previews");
  const g = tab === "glace1" ? 1 : tab === "glace2" ? 2 : null;
  if (!g || !tid) { // hors des pages de glace : on libere les iframes (et leurs connexions Firebase)
    box.hidden = true;
    for (const c of Object.values(pv.cells)) setFrame(c, "about:blank");
    return;
  }
  box.hidden = false;
  box.dataset.mode = pv.mode;
  Object.values(pv.cells).forEach((c) => c.rescale());
  fill(pv.head, h("b", {}, "Aperçus"),
    btn("Notre overlay", () => setPreviewMode("overlay"), pv.mode === "overlay" ? "on" : ""),
    btn("Scorebird", () => setPreviewMode("scorebird"), pv.mode === "scorebird" ? "on" : ""));
  const gl = pub.glaces?.[g] ?? {};
  for (const slot of ["live", "next"]) {
    const cell = pv.cells[slot];
    const m = pub.matches?.[gl[slot]];
    if (pv.mode === "overlay") setFrame(cell, new URL(`overlay.html?glace=${g}&mode=${slot}&tournoi=${tid}`, location.href).href, m ? "" : "Aucun match");
    else if (!gl.scorebird) setFrame(cell, "about:blank", "Entre le numéro Scorebird de la glace (en haut à droite).");
    else if (!m) setFrame(cell, "about:blank", "Aucun match");
    else setFrame(cell, scorebirdUrl(gl.scorebird, m, pub.teams));
  }
}

/* ---------- tournois : selection et abonnements ---------- */
let unsubCur = null;
let unsubPriv = null;

// Un seul abonnement au tournoi selectionne (et a ses notes privees) : on ne telecharge pas les autres tournois.
function subscribe() {
  unsubCur?.(); unsubCur = null; cur = null;
  unsubPriv?.(); unsubPriv = null; priv = {};
  if (tid) {
    unsubCur = onValue(ref(db, `public/tournois/${tid}`), (s) => { cur = s.val(); refreshView(); rerender(); }, () => toast("Lecture impossible"));
    if (user) unsubPriv = onValue(ref(db, `prive/${tid}`), (s) => { priv = s.val() ?? {}; rerender(); }, () => { priv = {}; });
  }
  refreshView();
}

function selectTournament(id) {
  tid = id;
  try { if (id) localStorage.setItem("tournoi-tid", id); else localStorage.removeItem("tournoi-tid"); } catch { /* stockage indisponible : on continue */ }
  subscribe();
  rerender();
}

// Le tournoi choisi doit exister ; sinon : le dernier utilise, le tournoi actif, puis le premier de la liste.
function ensureSelection() {
  let stored = null;
  try { stored = localStorage.getItem("tournoi-tid"); } catch { /* idem */ }
  const want = [tid, stored, actif, ...Object.keys(liste)].find((x) => x && liste[x]) ?? null;
  if (want !== tid) selectTournament(want);
}

async function nouveauTournoi() {
  const nom = prompt("Nom du nouveau tournoi ?")?.trim();
  if (!nom) return;
  const id = push(ref(db)).key;
  if (await w(() => update(ref(db), { ...newTournament(id, nom, Date.now()), ...(actif ? {} : { "public/actif": id }) }))) selectTournament(id);
}

const renommer = (id, nom) => {
  const n = nom?.trim();
  if (n) w(() => update(ref(db), { [`public/tournois/${id}/nom`]: n, [`public/liste/${id}/nom`]: n }));
};
const renommerTournoi = () => renommer(tid, prompt("Nouveau nom du tournoi ?", liste[tid]?.nom ?? ""));

async function supprimerTournoi(id) {
  if (!confirm(`Supprimer le tournoi « ${liste[id]?.nom} » ? Ses équipes, commanditaires, matchs et notes seront effacés (les bibliothèques restent). Télécharge une sauvegarde avant. Irréversible.`)) return;
  await w(() => update(ref(db), {
    [`public/tournois/${id}`]: null, [`public/liste/${id}`]: null, [`prive/${id}`]: null,
    ...(actif === id ? { "public/actif": null } : {}),
  }));
}

// Onglet Tournois : la liste de tous les tournois, avec renommer, ouvrir, activer et supprimer.
function tournois() {
  const ids = Object.keys(liste).sort((a, b) => (liste[b].cree ?? 0) - (liste[a].cree ?? 0));

        id === actif ? h("span", { class: "pill ok" }, "★ actif (overlays)") : btn("★ Définir comme actif", () => put("public/actif", id)),
        id === tid ? h("span", { class: "pill" }, "ouvert") : btn("Ouvrir", () => selectTournament(id)),

const TABS = [["glace1", "Glace 1"], ["glace2", "Glace 2"], ["horaire", "Horaire"], ["importer", "Importer"], ["equipes", "Équipes"],

let libTab = "teams";

const noTournament = () => h("div", { class: "match-card empty" },
  "Aucun tournoi. Crée-en un avec « + Nouveau », ou importe un horaire dans un nouveau tournoi (onglet Importer).");
const needT = (fn) => () => (tid ? fn() : noTournament());

function biblio() {
  const t = libTab === "teams";
  return h("div", {},
    h("div", { class: "row", style: "margin:8px 0" },
      btn("Équipes", () => { libTab = "teams"; render(); }, t ? "on" : ""),
      btn("Commanditaires", () => { libTab = "sponsors"; render(); }, t ? "" : "on")),
    h("div", { class: "meta", style: "margin-bottom:8px" }, "Bibliothèque commune à tous les tournois : tu y pioches logos, couleurs et noms complets depuis les onglets Équipes et Commanditaires d'un tournoi."),
    collection({ key: libTab, title: t ? "Équipe" : "Commanditaire", fields: t ? ["colors", "complet"] : [], scope: "lib" }));
}

function tournamentBar() {
  const ids = Object.keys(liste).sort((a, b) => (liste[b].cree ?? 0) - (liste[a].cree ?? 0));
  return [
    h("span", { class: "meta" }, "Tournoi"),
    h("select", { onchange: (e) => selectTournament(e.target.value || null) },
      ids.length ? ids.map((id) => h("option", { value: id, selected: id === tid }, `${liste[id].nom}${id === actif ? " ★" : ""}`)) : h("option", { value: "" }, "(aucun tournoi)")),
    btn("+ Nouveau", nouveauTournoi),
    tid && btn("Renommer", renommerTournoi),
    tid && tid !== actif && btn("★ Définir comme actif", () => put("public/actif", tid), "ok"),
    tid && tid === actif && h("span", { class: "pill live" }, "★ actif : les overlays affichent ce tournoi"),
  ];
}

// Anciennes donnees (avant les tournois) : rangees dans les bibliotheques, une seule fois.
function legacyBanner() {
  if (!hasLegacy(legacy) || !user) return null;
  const move = () => {
    if (hasLegacyMatches(legacy)) return toast("L'ancienne structure contient des matchs : ne les déplace pas, préviens-moi.");
    if (confirm("Ranger les anciennes équipes et les anciens commanditaires dans les bibliothèques, puis effacer l'ancienne structure ?")) w(() => update(ref(db), legacyMove(legacy, lib)));
  };
  return h("div", { class: "banner" }, "Anciennes données détectées (avant les tournois). ", btn("Ranger dans les bibliothèques", move, "ok"));
}

function render() {
  document.getElementById("conn").className = `badge${online ? " up" : ""}`;
  document.getElementById("conn").textContent = online ? "Connecté" : "Hors ligne";
  document.getElementById("user").replaceChildren(
    user ? btn("Déconnexion", () => signOut(auth)) : btn("Connexion Google", () => w(() => signInWithPopup(auth, new GoogleAuthProvider()))));
  fill(document.getElementById("bar"), tournamentBar());
  document.getElementById("tabs").replaceChildren(...TABS.map(([k, l]) => btn(l, () => { tab = k; history.replaceState(null, "", k.startsWith("glace") ? `?glace=${k.slice(5)}` : location.pathname); render(); }, tab === k ? "on" : "")));
  const views = {
    glace1: needT(() => glacePage(1)),
    glace2: needT(() => glacePage(2)),
    horaire: needT(horaire),
    importer,
    equipes: needT(() => collection({ key: "teams", title: "Équipe", fields: ["colors", "complet"], scope: "tournoi" })),
    sponsors: needT(() => collection({ key: "sponsors", title: "Commanditaire", fields: [], scope: "tournoi" })),
    biblio,
    tournois,
    sauvegarde,
  };
  fill(document.getElementById("app"),
    !user && h("div", { class: "banner" }, "Mode lecture seule : connecte-toi pour modifier."),
    legacyBanner(),
    tid && actif && tid !== actif && h("div", { class: "banner" }, `Ce tournoi n'est pas le tournoi actif : les overlays affichent « ${liste[actif]?.nom ?? "?"} ».`),
    views[tab]());
  updatePreviews();
  showFlash();
}

// Ne pas redessiner pendant qu'on tape dans un champ : on le fait en quittant le champ.
const rerender = () => {
  if (document.activeElement?.matches("input,select,textarea")) { dirty = true; return; }
  render();
};
document.addEventListener("change", (e) => e.target.blur());
document.addEventListener("focusout", () => { if (dirty) { dirty = false; setTimeout(render, 0); } });

const failed = () => toast("Lecture impossible");
onValue(ref(db, ".info/connected"), (s) => { online = s.val() === true; rerender(); });
onValue(ref(db, "public/lib"), (s) => { lib = s.val() ?? {}; refreshView(); rerender(); }, failed);
onValue(ref(db, "public/actif"), (s) => { actif = s.val(); ensureSelection(); refreshView(); rerender(); }, failed);
onValue(ref(db, "public/liste"), (s) => { liste = s.val() ?? {}; ensureSelection(); rerender(); }, failed);
for (const k of ["teams", "sponsors", "matches", "glaces"]) onValue(ref(db, `public/${k}`), (s) => { legacy[k] = s.val(); rerender(); }, failed);
let unsubGh = null;
onAuthStateChanged(auth, (u) => {
  user = u;
  unsubGh?.();
  unsubGh = null;
  ghAjoute = null;
  if (u) unsubGh = onValue(ref(db, "prive/githubAjoute"), (s) => { ghAjoute = s.val(); rerender(); }, () => { ghAjoute = null; });
  subscribe();
  rerender();
});
initPreviews();
render();
window.__charge = true;
</script>
</body>
</html>
