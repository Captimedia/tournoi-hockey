<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Capti Overlay</title>
<style>
  html, body { margin: 0; background: transparent; font-family: Arial, Helvetica, sans-serif; color: #fff; overflow: hidden; }
  #box { position: absolute; top: 40px; left: 40px; padding: 18px 24px; background: rgba(0,0,0,.65); border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,.4); display: none; }
  .title { font-size: 24px; opacity: .85; margin-bottom: 4px; }
  .sub { font-size: 24px; opacity: .9; margin-bottom: 10px; }
  .team { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: bold; margin: 6px 0; padding-left: 12px; border-left: 10px solid #666; }
  .team img { height: 52px; width: 52px; object-fit: contain; }
  .team .n { flex: 1; }
  .team .s { min-width: 48px; text-align: right; }
  .sp { margin-top: 12px; text-align: center; }
  .sp img { max-height: 60px; max-width: 100%; }
  iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; background: transparent; }
</style>
</head>
<body>
<div id="box"></div>
<script type="module">
import { db, ref, onValue } from "./firebase.js";
import { h, fill } from "./dom.js";
import { colorOf, scorebirdUrl, sideName } from "./logic.js";

// ?glace=1&mode=live | next | url  (url = overlay Scorebird complet du match en cours)
const p = new URLSearchParams(location.search);
const glace = p.get("glace") ?? "1";
const mode = ["next", "url"].includes(p.get("mode")) ? p.get("mode") : "live";
const box = document.getElementById("box");
const CACHE = "tournoi-public";

const dateFR = (d) => {
  const dt = new Date(`${d}T12:00:00`);
  return Number.isNaN(dt.getTime()) ? (d ?? "") : dt.toLocaleDateString("fr-CA", { weekday: "long", day: "numeric", month: "long" });
};

function team(pub, m, key, withScore) {
  const t = pub.teams?.[m[key]];
  const mode_ = m[`${key}Mode`] ?? (key === "away" ? "Secondary" : "Primary");
  const row = h("div", { class: "team", style: `border-left-color:${colorOf(t, mode_)}` },
    t?.logo && h("img", { src: t.logo, alt: "" }),
    h("span", { class: "n" }, sideName(m, key, pub.teams)),
    withScore && h("span", { class: "s" }, m[`${key}Score`] ?? 0));
  return row;
}

let lastUrl = "";
function render(pub) {
  const gl = pub?.glaces?.[glace] ?? {};
  const m = pub?.matches?.[mode === "next" ? gl.next : gl.live];
  if (!m) { box.style.display = "none"; box.replaceChildren(); return; }

  if (mode === "url") {
    if (!gl.scorebird) return;
    const url = scorebirdUrl(gl.scorebird, m, pub.teams);
    if (url !== lastUrl) {
      lastUrl = url;
      box.style.display = "none";
      document.querySelector("iframe")?.remove();
      document.body.append(h("iframe", { src: url, allow: "autoplay" }));
    }
    return;
  }

  const live = mode === "live";
  const sponsor = pub.sponsors?.[m.sponsor];
  fill(box,
    h("div", { class: "title" }, live ? `Partie : #${m.num ?? ""}` : "Prochain match :"),
    h("div", { class: "sub" },
      live ? "" : `#${m.num ?? ""} - ${dateFR(m.date)} ${m.heure ?? ""} `,
      [m.division, m.round].filter(Boolean).join(" - ")),
    team(pub, m, "away", live),
    team(pub, m, "home", live),
    sponsor?.logo && h("div", { class: "sp" }, h("img", { src: sponsor.logo, alt: "" })));
  box.style.display = "inline-block";
}

// Dernier etat connu : affiche tout de suite, meme si le reseau est lent ou coupe.
let data = null;
try { data = JSON.parse(localStorage.getItem(CACHE) ?? "null"); } catch { data = null; }
if (data) render(data);

onValue(ref(db, "public"), (s) => {
  data = s.val();
  render(data);
  try { localStorage.setItem(CACHE, JSON.stringify(data)); } catch { /* cache plein ou indisponible : on continue sans */ }
}, () => { /* erreur reseau : on garde le dernier etat affiche */ });
</script>
</body>
</html>
